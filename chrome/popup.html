<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<style>
  :root { color-scheme: light dark; }
  body { font: 13px/1.5 -apple-system, system-ui, "Apple SD Gothic Neo", "Segoe UI", sans-serif; width: 250px; margin: 14px; }
  h1 { font-size: 15px; margin: 0 0 10px; }
  .row { display: flex; justify-content: space-between; align-items: center; margin: 9px 0; gap: 8px; }
  select, button { font: inherit; }
  .note { font-size: 11px; opacity: .65; margin: 2px 0 0; line-height: 1.4; }
  hr { border: 0; border-top: 1px solid #8884; margin: 12px 0; }
</style></head>
<body>
  <h1>❄️ Typefall</h1>
  <div class="row"><span>효과</span>
    <select id="mode"><option value="off">끄기</option><option value="snow">눈</option><option value="stars">별가루</option></select></div>
  <div class="row"><span>효과 색상</span>
    <select id="tint"><option value="default">기본</option><option value="pink">핑크</option><option value="mint">민트</option>
      <option value="lavender">라벤더</option><option value="peach">피치</option><option value="sky">스카이</option></select></div>
  <div class="row"><span>파티클 양</span>
    <select id="density"><option value="low">하</option><option value="midlow">중하</option><option value="mid">중</option>
      <option value="midhigh">중상</option><option value="high">상</option></select></div>
  <hr>
  <div class="row"><label for="xmas">크리스마스 효과</label><input type="checkbox" id="xmas"></div>
  <p class="note">켜면 "크리스마스"/"christmas" 입력 시 효과가 터집니다. 키 내용은 저장·전송하지 않고, 입력 순서의 진행 상태만 이 기기 안에서 확인합니다. 비밀번호 입력창에서는 동작하지 않습니다.</p>
  <div class="row"><span></span><button id="preview">크리스마스 미리보기</button></div>
  <script src="popup.js"></script>
</body></html>
