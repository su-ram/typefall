<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<style>
  :root { color-scheme: light dark; }
  body { font: 13px/1.5 -apple-system, system-ui, "Apple SD Gothic Neo", "Segoe UI", sans-serif; width: 250px; margin: 14px; }
  h1 { font-size: 15px; margin: 0 0 10px; }
  .row { display: flex; justify-content: space-between; align-items: center; margin: 9px 0; gap: 8px; }
  select, button { font: inherit; }
  .note { font-size: 11px; opacity: .65; margin: 2px 0 0; line-height: 1.4; }
  #emojiBox { margin: 6px 0 2px; }
  #emojiCustom { width: 56px; font: inherit; font-size: 20px; text-align: center; }
  hr { border: 0; border-top: 1px solid #8884; margin: 12px 0; }
</style></head>
<body>
  <h1>❄️ Typefall</h1>
  <div class="row"><span>효과</span>
    <select id="mode"></select></div>
  <div id="emojiBox" hidden>
    <div class="row"><span>이모티콘</span><span><input id="emojiCustom" placeholder="🙂" aria-label="이모티콘 직접 입력"></span></div>
  </div>
  <div class="row"><span>효과 색상</span>
    <select id="tint"><option value="default">기본</option><option value="pink">핑크</option><option value="mint">민트</option>
      <option value="lavender">라벤더</option><option value="peach">피치</option><option value="yellow">노랑</option><option value="sky">스카이</option><option value="rainbow">레인보우</option></select></div>
  <div class="row"><span>파티클 양</span>
    <select id="density"><option value="s">조금</option><option value="m">보통</option><option value="l">많이</option></select></div>
  <hr>
  <div class="row"><label for="xmas">특별 효과</label><input type="checkbox" id="xmas"></div>
  <p class="note">켜면 "크리스마스"/"christmas" 입력 시 효과가 터집니다. 키 내용은 저장·전송하지 않고, 입력 순서의 진행 상태만 이 기기 안에서 확인합니다. 비밀번호 입력창에서는 동작하지 않습니다.</p>
  <hr>
  <div class="row"><span>특별 효과 키</span><span><b id="keyLabel">없음</b> <button id="keySet">지정</button> <button id="keyClear">해제</button></span></div>
  <p class="note">지정한 키를 누르면 특별 효과가 터집니다(기본: 없음). "지정"을 누른 뒤 원하는 키를 누르세요. 입력창에서 쓰는 글자 키를 고르면 그 글자를 칠 때마다 터집니다.</p>
  <div class="row"><span></span><button id="preview">특별 효과 미리보기</button></div>
  <script src="typefall-core.js"></script>
  <script src="popup.js"></script>
</body></html>
